<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Postora Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0c16; color: #e2e8f0; font-family: sans-serif; }
    .neon-border { border: 1px solid rgba(168, 85, 247, 0.4); box-shadow: 0 0 15px rgba(168, 85, 247, 0.15); }
    .neon-button { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35); }
    .neon-button:active { transform: scale(0.98); }
  </style>
</head>
<body class="p-4 flex flex-col min-h-screen">
  
  <!-- Хедер -->
  <div class="flex items-center justify-between mb-6 pb-3 border-b border-purple-900/40">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center font-black text-xl shadow-lg shadow-purple-600/50">P</div>
      <div>
        <h1 class="font-extrabold text-lg tracking-wide bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">POSTORA</h1>
        <p class="text-xs text-slate-400" id="user-greeting">Загрузка...</p>
      </div>
    </div>
    <button onclick="buyPro()" class="text-xs font-bold px-3 py-1.5 rounded-full bg-purple-900/60 text-purple-300 border border-purple-500/50 shadow-[0_0_10px_rgba(168,85,247,0.3)] hover:bg-purple-800 transition">
      💎 Купить PRO
    </button>
  </div>

  <!-- Навигация -->
  <div class="grid grid-cols-2 gap-2 mb-4">
    <button onclick="setTab('writer')" id="btn-writer" class="tab-btn py-2.5 px-3 rounded-xl text-xs font-semibold bg-purple-900/40 border border-purple-500/30 text-white">✍️ AI Writer</button>
    <button onclick="setTab('editor')" id="btn-editor" class="tab-btn py-2.5 px-3 rounded-xl text-xs font-semibold bg-slate-900/60 border border-transparent text-slate-400">✨ Smart Editor</button>
    <button onclick="setTab('planner')" id="btn-planner" class="tab-btn py-2.5 px-3 rounded-xl text-xs font-semibold bg-slate-900/60 border border-transparent text-slate-400">📅 Planner</button>
    <button onclick="setTab('rewriter')" id="btn-rewriter" class="tab-btn py-2.5 px-3 rounded-xl text-xs font-semibold bg-slate-900/60 border border-transparent text-slate-400">🔄 Rewriter</button>
  </div>

  <!-- Ввод -->
  <div class="neon-border bg-slate-900/50 rounded-2xl p-4 flex-1 flex flex-col mb-4">
    <label class="text-xs font-medium text-purple-300 mb-2 block" id="input-label">О чем написать публикацию?</label>
    <textarea id="prompt-input" rows="4" placeholder="Например: 5 нейросетей для дизайнера в 2026 году..." class="w-full flex-1 bg-black/40 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 transition resize-none"></textarea>

    <div id="style-selector" class="mt-3 hidden">
      <label class="text-xs text-slate-400 mb-1.5 block">Тональность:</label>
      <select id="tone-style" class="w-full bg-black/50 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none">
        <option value="formal">👔 Строгий и деловой</option>
        <option value="hype">🔥 Хайповый и вирусный</option>
        <option value="expert">🤓 Экспертный</option>
        <option value="funny">😂 Юмористический</option>
      </select>
    </div>

    <button onclick="generateContent()" id="submit-btn" class="neon-button text-white font-bold py-3 px-4 rounded-xl text-sm mt-4 w-full flex items-center justify-center">
      <span id="btn-text">Сгенерировать</span>
    </button>
  </div>

  <!-- Результат -->
  <div id="result-box" class="neon-border bg-slate-900/70 rounded-2xl p-4 hidden flex-col">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-purple-300">Готовый результат:</span>
      <button onclick="copyResult()" class="text-xs text-indigo-400 font-bold bg-indigo-900/40 px-2 py-1 rounded">📋 Копировать</button>
    </div>
    <div id="result-text" class="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto pr-1"></div>
  </div>

  <script>
    // Безопасная инициализация Telegram WebApp
    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    }

    // Приветствие юзера
    const greetingEl = document.getElementById('user-greeting');
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      greetingEl.innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
    } else {
      greetingEl.innerText = 'Гость (Браузер)';
    }

    let currentMode = 'writer';

    function setTab(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn py-2.5 px-3 rounded-xl text-xs font-semibold bg-slate-900/60 border border-transparent text-slate-400';
      });

      document.getElementById('btn-' + mode).className = 'tab-btn py-2.5 px-3 rounded-xl text-xs font-semibold bg-purple-900/40 border border-purple-500/30 text-white';

      const label = document.getElementById('input-label');
      const input = document.getElementById('prompt-input');
      const styleSelect = document.getElementById('style-selector');

      styleSelect.classList.add('hidden');

      if (mode === 'writer') {
        label.innerText = 'О чем написать публикацию?';
        input.placeholder = 'Короткая мысль: топ привычек программиста...';
      } else if (mode === 'editor') {
        label.innerText = 'Вставь сырой текст для оформления:';
        input.placeholder = 'Вставь сплошную простыню текста сюда...';
      } else if (mode === 'planner') {
        label.innerText = 'Тематика Telegram-канала:';
        input.placeholder = 'Например: Крипта, Спорт, Личный блог...';
      } else if (mode === 'rewriter') {
        label.innerText = 'Текст для рерайта:';
        input.placeholder = 'Вставь текст, который нужно переписать...';
        styleSelect.classList.remove('hidden');
      }
    }

    function buyPro() {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      if (tg && tg.showPopup) {
        tg.showPopup({
          title: '💎 PRO-версия',
          message: 'Оплата подписки происходит через официального бота. Закрыть редактор и вернуться в чат для оплаты?',
          buttons: [{id: 'yes', type: 'default', text: 'Перейти к оплате'}, {type: 'cancel', text: 'Отмена'}]
        }, function(btnId) {
          if (btnId === 'yes') tg.close();
        });
      } else {
        alert('Перейдите в чат с ботом для покупки PRO.');
      }
    }

    async function generateContent() {
      const text = document.getElementById('prompt-input').value.trim();
      if (!text) {
        alert('Пожалуйста, введи текст для генерации!');
        return;
      }

      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      
      const btnText = document.getElementById('btn-text');
      const btn = document.getElementById('submit-btn');
      btnText.innerText = '🧠 Нейросеть думает...';
      btn.disabled = true;
      document.getElementById('result-box').classList.add('hidden');

      const styleValue = document.getElementById('tone-style').value;
      
      const prompts = {
        writer: "Ты SMM-копирайтер. Напиши пост для Telegram на заданную тему. Сделай заголовок, абзацы и расставь эмодзи.",
        editor: "Сделай красивую верстку этого текста для Telegram. Разбей на короткие абзацы, выдели важное жирным шрифтом, расставь эмодзи.",
        planner: "Составь контент-план на 7 дней для Telegram-канала на эту тему. Формат: День, Тема, Краткий тезис.",
        rewriter: `Перепиши этот текст в стиле: ${styleValue}. Сохрани смысл, но измени подачу.`
      };

      const systemPrompt = prompts[currentMode];

      try {
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: text }
            ],
            model: "openai",
            seed: Math.floor(Math.random() * 100000)
          })
        });

        if (!response.ok) throw new Error('Ошибка сервера');
        
        const aiText = await response.text();
        
        document.getElementById('result-box').classList.remove('hidden');
        document.getElementById('result-text').innerText = aiText;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } catch (err) {
        alert('Слишком много запросов или сервер перегружен. Попробуй через пару секунд!');
      } finally {
        btnText.innerText = 'Сгенерировать';
        btn.disabled = false;
      }
    }

    function copyResult() {
      const text = document.getElementById('result-text').innerText;
      navigator.clipboard.writeText(text);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      if (tg && tg.showPopup) {
        tg.showPopup({ title: 'Скопировано!', message: 'Текст успешно скопирован в буфер обмена.', buttons: [{ type: 'ok' }] });
      } else {
        alert('Скопировано!');
      }
    }
  </script>
</body>
</html>
